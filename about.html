<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Romain Baylet — Photography</title>
  <meta
    name="description"
    content="Fine art and travel photography by Romain Baylet."
  >

  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #f7f5f0;
      --text: #26241f;
      --muted: #716b62;
      --line: #dedbd3;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "DM Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body.viewer-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    figure {
      margin: 0;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 6px;
    }

    .container {
      width: min(1180px, calc(100% - 96px));
      margin-inline: auto;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* HEADER */

    .site-header {
      padding: 30px 0;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 28px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .brand-name {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 23px;
      font-weight: 400;
    }

    .brand-description {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 34px;
    }

    .navigation a {
      padding-block: 10px;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-underline-offset: 6px;
    }

    .navigation a:hover {
      text-decoration: underline;
    }

    /* OPENING PHOTOGRAPH */

    .lead-work {
      padding: 38px 0 90px;
    }

    .lead-figure {
      width: fit-content;
      max-width: 100%;
      margin-inline: auto;
    }

    .photo-open {
      display: block;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: zoom-in;
      appearance: none;
      -webkit-appearance: none;
    }

    .lead-button {
      width: fit-content;
      max-width: 100%;
      margin-inline: auto;
    }

    .lead-image {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 70vh;
      max-height: 70svh;
    }

    .photo-caption {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
      letter-spacing: 1px;
    }

    /* SELECTED WORK */

    .selected-work {
      padding: 80px 0 110px;
      border-top: 1px solid var(--line);
      scroll-margin-top: 30px;
    }

    .section-label {
      margin: 0 0 60px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .work-list {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: 24px;
      row-gap: 100px;
      align-items: start;
    }

    .work-item:first-child {
      grid-column: 1 / span 7;
    }

    .work-item:last-child {
      grid-column: 8 / span 5;
      margin-top: 180px;
    }

    .work-button {
      width: 100%;
    }

    .work-image {
      width: 100%;
      height: auto;
    }

    /* QUIET CLOSING */

    .closing {
      padding: 70px 0 90px;
    }

    .closing-inner {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 32px;
    }

    .closing p {
      margin: 0;
      max-width: 520px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.45;
    }

    .text-link {
      flex-shrink: 0;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--text);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* FOOTER */

    .site-footer {
      padding: 28px 0;
      border-top: 1px solid var(--line);
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .6px;
    }

    .footer-inner a {
      padding-block: 8px;
    }

    .footer-inner a:hover {
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    /* FULL-SCREEN PHOTOGRAPH VIEWER */

    .photo-viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 70px 24px 28px;
      border: 0;
      background: #171613;
      color: var(--background);
      overflow: auto;
    }

    .photo-viewer:not([open]) {
      display: none;
    }

    .photo-viewer::backdrop {
      background: #171613;
    }

    .viewer-content {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .viewer-image {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100vh - 160px);
      max-height: calc(100dvh - 160px);
      object-fit: contain;
    }

    .viewer-caption {
      margin: 0;
      font-size: 11px;
      letter-spacing: 1px;
      text-align: center;
    }

    .viewer-close {
      position: fixed;
      top: 16px;
      right: 20px;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 50%;
      background: #171613;
      color: white;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .viewer-close:focus-visible {
      outline-color: white;
    }

    /* TABLET */

    @media (max-width: 900px) {
      .container {
        width: calc(100% - 48px);
      }

      .work-list {
        gap: 20px;
      }

      .work-item:last-child {
        margin-top: 120px;
      }

      .closing-inner {
        align-items: flex-start;
      }
    }

    /* PHONE */

    @media (max-width: 600px) {
      .container {
        width: calc(100% - 36px);
      }

      .site-header {
        padding: 24px 0 18px;
      }

      .header-inner {
        flex-direction: column;
        gap: 18px;
      }

      .brand {
        align-items: center;
      }

      .brand-name {
        font-size: 22px;
      }

      .navigation {
        gap: 30px;
      }

      .lead-work {
        padding: 28px 0 64px;
      }

      .lead-figure,
      .lead-button {
        width: 100%;
      }

      .lead-image {
        width: 100%;
        height: auto;
        max-height: none;
      }

      .selected-work {
        padding: 54px 0 64px;
      }

      .section-label {
        margin-bottom: 36px;
      }

      .work-list {
        display: block;
      }

      .work-item:last-child {
        margin-top: 60px;
      }

      .closing {
        padding: 25px 0 65px;
      }

      .closing-inner {
        flex-direction: column;
        gap: 25px;
      }

      .closing p {
        font-size: 27px;
      }

      .footer-inner {
        font-size: 9px;
      }

      .photo-viewer {
        padding-inline: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a
        class="brand"
        href="index.html"
        aria-label="Romain Baylet — Home"
      >
        <span class="brand-name">Romain Baylet</span>
        <span class="brand-description">
          Fine Art &amp; Travel Photography
        </span>
      </a>

      <nav class="navigation" aria-label="Main navigation">
        <a href="#work">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="visually-hidden">
      Fine art and travel photography by Romain Baylet
    </h1>

    <!-- OPENING PHOTOGRAPH -->

    <section
      class="lead-work container"
      aria-label="Featured photograph"
    >
      <figure class="lead-figure">
        <button
          class="photo-open lead-button"
          type="button"
          aria-label="Enlarge photograph of the red corridor in Agra"
          aria-haspopup="dialog"
          data-image="images/red.jpg.JPG"
          data-title="Agra, India"
        >
          <img
            class="lead-image"
            src="images/red.jpg.JPG"
            alt="A red sandstone corridor with repeating doorways in Agra"
            fetchpriority="high"
          >
        </button>

        <figcaption class="photo-caption">
          <span>Agra, India</span>
          <span>01</span>
        </figcaption>
      </figure>
    </section>

    <!-- SELECTED WORK -->

    <section
      id="work"
      class="selected-work"
      aria-labelledby="work-heading"
    >
      <div class="container">
        <h2 id="work-heading" class="section-label">
          Selected work
        </h2>

        <div class="work-list">
          <figure class="work-item">
            <button
              class="photo-open work-button"
              type="button"
              aria-label="Enlarge photograph of the Taj Mahal"
              aria-haspopup="dialog"
              data-image="images/taj-mahal-golden-hour.JPG.JPG"
              data-title="Agra, India"
            >
              <img
                class="work-image"
                src="images/taj-mahal-golden-hour.JPG.JPG"
                alt="Golden-hour light on the Taj Mahal in Agra"
                loading="lazy"
                decoding="async"
              >
            </button>

            <figcaption class="photo-caption">
              <span>Agra, India</span>
              <span>02</span>
            </figcaption>
          </figure>

          <figure class="work-item">
            <button
              class="photo-open work-button"
              type="button"
              aria-label="Enlarge photograph of a wooden boat in Venice"
              aria-haspopup="dialog"
              data-image="images/Wooden_boat.JPG"
              data-title="Venice, Italy"
            >
              <img
                class="work-image"
                src="images/Wooden_boat.JPG"
                alt="A wooden motorboat crossing the water in Venice"
                loading="lazy"
                decoding="async"
              >
            </button>

            <figcaption class="photo-caption">
              <span>Venice, Italy</span>
              <span>03</span>
            </figcaption>
          </figure>
        </div>
      </div>
    </section>

    <!-- CLOSING -->

    <section class="closing" aria-label="About the photographer">
      <div class="container closing-inner">
        <p>Light, place, and what remains.</p>
        <a class="text-link" href="about.html">
          About the photographer
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year">2026</span> Romain Baylet</span>
      <a href="contact.html">Contact</a>
    </div>
  </footer>

  <!-- FULL-SCREEN PHOTOGRAPH VIEWER -->

  <dialog
    class="photo-viewer"
    id="photoViewer"
    aria-label="Photograph viewer"
  >
    <button
      class="viewer-close"
      id="closeViewer"
      type="button"
      aria-label="Close photograph"
      autofocus
    >
      ×
    </button>

    <div class="viewer-content" id="viewerContent">
      <img class="viewer-image" id="viewerImage" alt="">
      <p class="viewer-caption" id="viewerCaption"></p>
    </div>
  </dialog>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    const viewer = document.getElementById("photoViewer");
    const viewerImage = document.getElementById("viewerImage");
    const viewerCaption = document.getElementById("viewerCaption");
    const viewerContent = document.getElementById("viewerContent");
    const closeButton = document.getElementById("closeViewer");

    let lastOpenedButton = null;

    document.querySelectorAll(".photo-open").forEach((button) => {
      button.addEventListener("click", () => {
        const thumbnail = button.querySelector("img");

        lastOpenedButton = button;
        viewerImage.src = button.dataset.image;
        viewerImage.alt = thumbnail.alt;
        viewerCaption.textContent = button.dataset.title;

        if (!viewer.open) {
          viewer.showModal();
          document.body.classList.add("viewer-open");
        }
      });
    });

    closeButton.addEventListener("click", () => {
      viewer.close();
    });

    viewer.addEventListener("click", (event) => {
      if (
        event.target === viewer ||
        event.target === viewerContent
      ) {
        viewer.close();
      }
    });

    viewer.addEventListener("close", () => {
      document.body.classList.remove("viewer-open");

      if (lastOpenedButton) {
        lastOpenedButton.focus({ preventScroll: true });
      }
    });
  </script>
</body>
</html>
