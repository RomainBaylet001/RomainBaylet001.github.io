<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Fine art, street and travel photography by Romain Baylet."
  >

  <title>Fine Art — Romain Baylet</title>

  <link
    rel="icon"
    type="image/png"
    href="../favicon.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../styles.css?v=6"
  >

</head>


<body>


<header class="site-header">


  <div class="brand-block">

    <a
      href="/"
      class="logo"
      aria-label="Romain Baylet home"
    >
      Romain Baylet
    </a>


    <a
      href="/fine-art/"
      class="brand-fine-art"
    >
      Fine Art
    </a>

  </div>


  <nav
    class="desktop-nav"
    aria-label="Main navigation"
  >

    <a href="/work/">
      Work
    </a>

    <a href="/about/">
      About
    </a>

  </nav>


  <button
    class="menu-button"
    type="button"
    aria-label="Open menu"
    aria-expanded="false"
  >
    Menu
  </button>

</header>



<div
  class="mobile-menu"
  aria-label="Mobile navigation"
>

  <a href="/work/">
    Work
  </a>

  <a href="/about/">
    About
  </a>

  <a href="/fine-art/">
    Fine Art
  </a>

</div>



<main>


<section class="section fine-art-section">

  <div class="section-intro">

    <div>

      <p class="eyebrow">
        Personal Work
      </p>

    </div>


    <div>

      <h1>
        Places, people and
        the moments that remain.
      </h1>


      <p class="section-description">
        Photography made while travelling, walking and paying
        attention — people, places and small moments worth keeping.
      </p>

    </div>

  </div>


  <div class="fine-art-grid">


    <a
      href="#"
      class="fine-art-item fine-art-one"
    >

      <span>
        India
      </span>

    </a>


    <a
      href="#"
      class="fine-art-item fine-art-two"
    >

      <span>
        People
      </span>

    </a>


    <a
      href="#"
      class="fine-art-item fine-art-three"
    >

      <span>
        Travel
      </span>

    </a>


  </div>

</section>


</main>



<footer class="footer">

  <div>
    © <span id="current-year"></span> Romain Baylet
  </div>


  <div class="footer-links">

    <a href="/work/">
      Work
    </a>

    <a href="/">
      Home
    </a>

  </div>

</footer>


<script src="../script.js"></script>
