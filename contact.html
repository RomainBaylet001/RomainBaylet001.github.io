<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact – Romain Baylet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="logo">
      <a href="index.html">Romain Baylet</a>
      <span class="tagline">Fine Art Photography</span>
    </div>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="contact-hero">
    <div class="container" style="max-width: 720px;">
      <h1 class="contact-title">Get in touch</h1>
      <p class="contact-subtitle">
        For commissions and enquiries. I read everything and reply personally.
      </p>
    </div>
  </section>

  <section class="contact-wrap">

    <div class="success-panel" id="successPanel">
      <strong>Message sent.</strong>
      Thank you. I’ll reply personally.
    </div>

    <form class="contact-form" id="contactForm" action="https://formspree.io/f/xeejjjkz" method="POST">
      <div class="form-grid">
        <div class="field">
          <label for="name">Name *</label>
          <input id="name" name="name" type="text" required autocomplete="name">
        </div>

        <div class="field">
          <label for="email">Email address *</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>

        <div class="field full">
          <label for="message">Message *</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <input type="hidden" name="_subject" value="New enquiry — RomainBaylet.com">
      </div>

      <div class="contact-actions">
        <button class="contact-button" type="submit" id="sendBtn">Send message</button>

        <div class="contact-direct">
          Or email directly: <a href="mailto:romainbaylet@icloud.com">romainbaylet@icloud.com</a>
        </div>
      </div>

      <div class="form-status" id="formStatus"></div>
    </form>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span>© <span id="year"></span> Romain Baylet</span>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const form = document.getElementById("contactForm");
    const statusEl = document.getElementById("formStatus");
    const btn = document.getElementById("sendBtn");
    const successPanel = document.getElementById("successPanel");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "";
      statusEl.className = "form-status";
      btn.disabled = true;

      try {
        const formData = new FormData(form);
        const res = await fetch(form.action, {
          method: "POST",
          body: formData,
          headers: { "Accept": "application/json" }
        });

        if (res.ok) {
          successPanel.classList.add("is-visible");
          form.reset();
        } else {
          statusEl.textContent = "Something went wrong. Please try again.";
          statusEl.classList.add("is-error");
        }
      } catch (err) {
        statusEl.textContent = "Network error. Please try again.";
        statusEl.classList.add("is-error");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</footer>

</body>
</html>
