<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Commercial product, food and still-life photography by Romain Baylet."
  >

  <title>Work — Romain Baylet</title>

  <link
    rel="icon"
    type="image/png"
    href="../favicon.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../styles.css?v=6"
  >

</head>


<body>


<!-- ======================================================
     HEADER
====================================================== -->

<header class="site-header">

  <div class="brand-block">

    <a
      href="/"
      class="logo"
      aria-label="Romain Baylet home"
    >
      Romain Baylet
    </a>


    <a
      href="/fine-art/"
      class="brand-fine-art"
    >
      Fine Art
    </a>

  </div>


  <nav
    class="desktop-nav"
    aria-label="Main navigation"
  >

    <a href="/work/">
      Work
    </a>

    <a href="/about/">
      About
    </a>

    <a href="/contact/">
      Contact
    </a>

  </nav>


  <button
    class="menu-button"
    type="button"
    aria-label="Open menu"
    aria-expanded="false"
  >
    Menu
  </button>

</header>



<!-- ======================================================
     MOBILE MENU
====================================================== -->

<div
  class="mobile-menu"
  aria-label="Mobile navigation"
>

  <a href="/work/">
    Work
  </a>

  <a href="/about/">
    About
  </a>

  <a href="/contact/">
    Contact
  </a>

  <a href="/fine-art/">
    Fine Art
  </a>

</div>



<main>


<!-- ======================================================
     COMMERCIAL WORK
====================================================== -->

<section class="section work-section">


  <div class="work-intro">

    <p class="eyebrow">
      Selected Work
    </p>


    <h1>
      Commercial work.
    </h1>


    <p class="work-categories">
      Product · Food · Beverage · Still Life
    </p>

  </div>



<!-- ======================================================
     WORK COLLAGE
====================================================== -->

  <div class="work-collage">


    <!-- PRODUCT -->

    <article
      class="work-card work-card-one"
    >

      <a href="/contact/">

        <div
          class="work-image work-image-one"
        ></div>


        <div class="work-caption">

          <h2>
            Product / Still Life
          </h2>

        </div>

      </a>

    </article>



    <!-- FOOD -->

    <article
      class="work-card work-card-two"
    >

      <a href="/contact/">

        <div
          class="work-image work-image-two"
        ></div>


        <div class="work-caption">

          <h2>
            Food / Beverage
          </h2>

        </div>

      </a>

    </article>



    <!-- OBJECTS -->

    <article
      class="work-card work-card-three"
    >

      <a href="/contact/">

        <div
          class="work-image work-image-three"
        ></div>


        <div class="work-caption">

          <h2>
            Objects / Campaign
          </h2>

        </div>

      </a>

    </article>


  </div>

</section>


</main>



<!-- ======================================================
     FOOTER
====================================================== -->

<footer class="footer">

  <div>
    © <span id="current-year"></span> Romain Baylet
  </div>


  <div class="footer-links">

    <a href="/">
      Home
    </a>

    <a href="/contact/">
      Contact
    </a>

  </div>

</footer>



<!-- ======================================================
     JAVASCRIPT
====================================================== -->

<script src="../script.js"></script>


</body>

</html>
