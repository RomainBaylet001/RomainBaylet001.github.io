  <link rel="icon" type="image/png" href="../favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=9">
</head>

<body>

<header class="site-header">
  <div class="brand-block">
    <a href="/" class="logo" aria-label="Romain Baylet home">Romain Baylet</a>
    <a href="/fine-art/" class="brand-fine-art">Fine Art</a>
  </div>

  <nav class="desktop-nav" aria-label="Main navigation">
    <a href="/work/" aria-current="page">Work</a>
    <a href="/about/">About</a>
    <a href="/contact/">Contact</a>
  </nav>

  <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false">
    Menu
  </button>
</header>

<div class="mobile-menu" aria-label="Mobile navigation">
  <a href="/work/" aria-current="page">Work</a>
  <a href="/about/">About</a>
  <a href="/contact/">Contact</a>
  <a href="/fine-art/">Fine Art</a>
</div>

<main>

<section class="section work-section">

  <div class="work-intro">
    <p class="eyebrow">Selected Work</p>
    <h1>Commercial work.</h1>
    <p class="work-categories">Product · Food · Beverage · Still Life</p>
  </div>

  <div class="work-collage">

    <article class="work-card work-card-one">
      <div class="work-image work-image-one" role="img" aria-label="Food and beverage photography"></div>

      <div class="work-caption">
        <h2>Food / Beverage</h2>
      </div>
    </article>

    <article class="work-card work-card-two">
      <div class="work-image work-image-two" role="img" aria-label="Product and still life photography"></div>

      <div class="work-caption">
        <h2>Product / Still Life</h2>
      </div>
    </article>

    <article class="work-card work-card-three">
      <div class="work-image work-image-three" role="img" aria-label="Objects and campaign photography"></div>

      <div class="work-caption">
        <h2>Objects / Campaign</h2>
      </div>
    </article>

  </div>

</section>

</main>

<footer class="footer">
  <div>© <span id="current-year"></span> Romain Baylet</div>

  <div class="footer-links">
    <a href="/">Home</a>
    <a href="/contact/">Contact</a>
  </div>
</footer>

<script src="../script.js"></script>
